services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app1
      - app2

  app1:
    build: ./backend
    env_file: .env
    depends_on:
      - postgres
      - redis

  app2:
    build: ./backend
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    command: rq worker tasks --url redis://redis:6379/0
    env_file: .env
    stop_grace_period: 150s
    depends_on:
      - postgres
      - redis

  autoscaler:
    build: ./backend
    command: python -m app.autoscaler
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    stop_grace_period: 160s
    depends_on:
      - redis
      - worker

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webapp
      POSTGRES_USER: webapp
      POSTGRES_PASSWORD: webapp
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
